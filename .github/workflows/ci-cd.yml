name: ParkEase CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker-build-and-smoke-test:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t parkease:ci .

      - name: Run container
        run: docker run -d -p 3000:3000 --name parkease-test parkease:ci

      - name: Wait for container to be ready
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:3000/health

      - name: Stop container
        if: always()
        run: docker stop parkease-test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-build-and-smoke-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK }}"